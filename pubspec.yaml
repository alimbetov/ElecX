name: elecx
description: Client-oriented electrical engineering design application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.20.0
  # Explicit native-asset pin; Dart hook verifies upstream SHA-256.
  sqlite3: 3.9.0
  crypto: 3.0.7
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Official sqlite3 build-hook transport selection. OS packages must be
# independently qualified for production Linux/macOS; other targets keep
# upstream SHA-256-verified, bundled native assets.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
        macos: system
        default: sqlite3

flutter:
  uses-material-design: true
