name: Bootstrap macOS runner once

on:
  push:
    branches:
      - fix/desktop-path-provider-packaging
    paths:
      - '.github/workflows/bootstrap-macos-runner-once.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/desktop-path-provider-packaging
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - name: Generate canonical macOS shell
        run: flutter create --platforms=macos --project-name elecx --org kz.elecx .
      - name: Remove generated template artifacts
        run: |
          rm -f test/widget_test.dart elecx.iml
          rm -rf .idea
          git restore analysis_options.yaml pubspec.yaml pubspec.lock
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build macOS debug app
        run: flutter build macos --debug
      - name: Runtime path_provider smoke
        run: flutter test integration_test/path_provider_macos_smoke_test.dart -d macos
      - name: Remove one-shot bootstrap
        run: git rm .github/workflows/bootstrap-macos-runner-once.yml
      - name: Commit generated macOS runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add macos .metadata
          git commit -m 'fix(macos): add canonical Flutter desktop runner'
          git push origin HEAD:fix/desktop-path-provider-packaging
