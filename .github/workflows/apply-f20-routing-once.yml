name: Apply F20 multi obstacle routing once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - '.github/workflows/apply-f20-routing-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply F20 routing
        run: python3 tool/apply_f20_multi_obstacle_routing_once.py
      - name: Fix F20 test const hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/f20_multi_obstacle_routing_test.dart')
          text = p.read_text()
          text = text.replace(
              "  const surface = RoomSurfaceRef.wall('room-f20', 0);",
              "  final surface = RoomSurfaceRef.wall('room-f20', 0);",
              1,
          )
          text = text.replace('    const context = RouteNormativeContext(', '    final context = RouteNormativeContext(')
          p.write_text(text)
          PY
      - name: Format
        run: dart format lib test
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Focused F20 tests
        run: flutter test test/f20_multi_obstacle_routing_test.dart test/normative_route_engine_test.dart
      - name: Full test suite
        run: flutter test
      - name: Remove one-shot staging
        run: |
          git rm .github/workflows/apply-f20-routing-once.yml
          git rm tool/apply_f20_multi_obstacle_routing_once.py
      - name: Commit verified F20
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'fix(editor): route through multiple obstacles'
          git push origin HEAD:feat/spatial-editor-interaction-hardening
