name: Harden project orientation once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - tool/harden_project_orientation_once.py
      - .github/workflows/harden-project-orientation-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply project orientation hardening
        run: python3 tool/harden_project_orientation_once.py
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Remove one-shot helper
        run: |
          rm -f tool/harden_project_orientation_once.py
          rm -f .github/workflows/harden-project-orientation-once.yml
      - name: Commit verified project orientation hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): make project north editable and persistent"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
