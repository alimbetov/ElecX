name: macOS Desktop

on:
  push:
    branches:
      - main
      - fix/desktop-path-provider-packaging
    paths:
      - 'macos/**'
      - 'integration_test/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    paths:
      - 'macos/**'
      - 'integration_test/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

jobs:
  macos-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build macOS debug app
        run: flutter build macos --debug
      - name: Runtime path_provider smoke
        run: flutter test integration_test/path_provider_macos_smoke_test.dart -d macos
