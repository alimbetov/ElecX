name: macOS Desktop

on:
  push:
    branches:
      - main
      - fix/desktop-path-provider-packaging
      - feat/pre-p10-defect-remediation
    paths:
      - 'macos/**'
      - 'integration_test/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/desktop-macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'integration_test/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/desktop-macos.yml'

jobs:
  macos-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        shell: bash
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build macOS debug app
        run: flutter build macos --debug
      - name: Runtime path_provider smoke
        run: flutter test integration_test/path_provider_macos_smoke_test.dart -d macos
