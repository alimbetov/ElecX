name: Apply F10 F11 F13 hardening once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - '.github/workflows/apply-f10-f11-f13-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Apply F10 F11 F13 patch
        run: |
          python3 tool/apply_f10_f11_f13_once.py
          python3 tool/apply_f10_f11_f13_post.py

      - name: Format
        run: dart format lib test

      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Full tests
        run: flutter test

      - name: Remove one-shot staging
        run: |
          git rm .github/workflows/apply-f10-f11-f13-once.yml
          git rm tool/apply_f10_f11_f13_once.py
          git rm tool/apply_f10_f11_f13_post.py

      - name: Commit verified hardening patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'fix(editor): close layer draft and invalid-preview gaps'
          git push origin HEAD:feat/spatial-editor-interaction-hardening

# rerun after analyzer-only staging fixes
