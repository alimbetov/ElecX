name: P6F Production Wire Once

on:
  push:
    branches:
      - feat/project-structure-authoring

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/project-structure-authoring
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply deterministic wiring patch
        run: python3 .github/p6f_wire.py
      - name: Format production wiring
        run: dart format lib/src/features/editor/unified_workspace_editor_screen.dart lib/src/features/editor/canonical_editor_production_runtime.dart
      - name: Remove one-shot files
        run: rm .github/p6f_wire.py .github/workflows/p6f-production-wire-once.yml
      - name: Commit production wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(p6f): wire canonical room semantics inspector'
          git push origin HEAD:feat/project-structure-authoring
