name: Persist cable constraints once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - tool/persist_cable_constraints_once.py
      - .github/workflows/persist-cable-constraints-once.yml

permissions:
  contents: write

jobs:
  migrate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Apply persistence migration
        run: python3 tool/persist_cable_constraints_once.py
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Remove one-shot helpers
        run: |
          rm -f tool/persist_cable_constraints_once.py
          rm -f .github/workflows/persist-cable-constraints-once.yml
      - name: Commit verified persistence hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): persist cable routing constraints"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
