name: P6 Format Once

on:
  push:
    branches: [feat/project-structure-authoring]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/project-structure-authoring
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format Dart sources
        run: dart format lib test
      - name: Remove one-shot workflow
        run: rm .github/workflows/p6-format-once.yml
      - name: Commit formatter cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(p6): normalize Dart formatting'
          git push origin HEAD:feat/project-structure-authoring
