name: Finalize runtime hardening once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        run: flutter pub get
      - name: Fetch canonical canvas baseline
        run: git fetch origin 252f814a5f4ace569c934366f9bcf1413039982b --depth=1
      - name: Apply runtime hardening patch
        run: python3 tool/finalize_runtime_hardening_once.py
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Remove one-shot helpers
        run: |
          rm .github/workflows/finalize-runtime-hardening-once.yml
          rm tool/finalize_runtime_hardening_once.py
      - name: Commit verified hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(editor): verify runtime interaction hardening'
          git push origin HEAD:feat/spatial-editor-interaction-hardening
