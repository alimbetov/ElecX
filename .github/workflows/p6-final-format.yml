name: P6 Final Format

on:
  push:
    branches:
      - feat/project-structure-authoring

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feat/project-structure-authoring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format exact P6 quality set
        run: |
          dart format \
            lib/src/application/project/project_destructive_commands.dart \
            lib/src/application/project/project_mutation.dart \
            lib/src/application/project/project_space_commands.dart \
            lib/src/application/project/project_space_semantics_commands.dart \
            lib/src/domain/project_aggregate.dart \
            lib/src/domain/project_identity.dart \
            lib/src/serialization/project/canonical_project_document_codec.dart \
            test/canonical_project_document_codec_test.dart \
            test/p5d_g_closure_test.dart \
            test/p6_semantic_mutation_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/application/project/project_destructive_commands.dart \
            lib/src/application/project/project_mutation.dart \
            lib/src/application/project/project_space_commands.dart \
            lib/src/application/project/project_space_semantics_commands.dart \
            lib/src/domain/project_aggregate.dart \
            lib/src/domain/project_identity.dart \
            lib/src/serialization/project/canonical_project_document_codec.dart \
            test/canonical_project_document_codec_test.dart \
            test/p5d_g_closure_test.dart \
            test/p6_semantic_mutation_test.dart
          git commit -m "style(p6): apply final targeted dart format"
          git push origin "HEAD:feat/project-structure-authoring"
