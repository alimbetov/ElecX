name: P9.13 Final Acceptance

on:
  push:
    branches:
      - main
      - "feat/p9-apartment-topology-generator"
      - "feat/pre-p10-defect-remediation"
  pull_request:
  workflow_dispatch:

concurrency:
  group: p9-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: H Repository quality prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - run: flutter pub get
      - name: Reference environment
        run: |
          uname -a
          lscpu
          free -m
          flutter --version
      - name: Check repository and qualification formatting
        id: repository-format
        continue-on-error: true
        run: |
          mkdir -p build/p9-final-acceptance
          set +e
          dart format --output=none --set-exit-if-changed lib test qualification_test tool
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            dart format lib test qualification_test tool
            git diff -- lib test qualification_test tool > build/p9-final-acceptance/repository-format.diff
          fi
          exit "$status"
      - name: Upload repository formatter diagnostics
        if: steps.repository-format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-repository-format-failure-${{ github.sha }}
          path: build/p9-final-acceptance/repository-format.diff
          if-no-files-found: error
          retention-days: 14
      - name: Enforce repository and qualification formatting
        if: steps.repository-format.outcome == 'failure'
        run: exit 1
      - name: Static analysis
        id: static-analysis
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter analyze 2>&1 | tee build/p9-final-acceptance/flutter-analyze.log
      - name: Upload analyzer failure diagnostics
        if: failure() && steps.static-analysis.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-flutter-analyze-failure-${{ github.sha }}
          path: build/p9-final-acceptance/flutter-analyze.log
          if-no-files-found: error
          retention-days: 14
      - name: P8 NFR accessibility and i18n regression gate
        id: p8-regression
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter test --concurrency=1 \
            test/p8_wizard_nfr_a11y_i18n_qualification_test.dart \
            test/p8_wizard_r23_extended_qualification_test.dart \
            2>&1 | tee build/p9-final-acceptance/p8-regression.log
      - name: Upload P8 regression failure diagnostics
        if: failure() && steps.p8-regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-p8-regression-failure-${{ github.sha }}
          path: build/p9-final-acceptance/p8-regression.log
          if-no-files-found: error
          retention-days: 14
      - name: Complete Flutter regression suite
        run: flutter test
      - name: Acceptance evidence structure exists
        run: |
          test -s docs/architecture/p9/p9.13-requirement-traceability-v1.md
          test -s docs/architecture/p9/p9-acceptance-audit-v1-2026-10-28.md

  domain-qualification:
    name: A Domain qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - run: flutter pub get
      - name: Reference environment
        run: |
          uname -a
          lscpu
          free -m
          flutter --version
      - name: Check P9.13 qualification formatting
        id: qualification-format
        continue-on-error: true
        run: |
          mkdir -p build/p9-final-acceptance
          set +e
          dart format --output=none --set-exit-if-changed qualification_test tool
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            dart format qualification_test tool
            git diff -- qualification_test tool > build/p9-final-acceptance/qualification-format.diff
          fi
          exit "$status"
      - name: Upload P9.13 qualification formatter diagnostics
        if: steps.qualification-format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-qualification-format-failure-${{ github.sha }}
          path: build/p9-final-acceptance/qualification-format.diff
          if-no-files-found: error
          retention-days: 14
      - name: Enforce P9.13 qualification formatting
        if: steps.qualification-format.outcome == 'failure'
        run: exit 1
      - name: Supported + invalid + property/fuzz + determinism
        run: >-
          flutter test --concurrency=1
          qualification_test/p9_p913_domain_qualification_test.dart

  performance-qualification:
    name: A-C P9.13 performance + memory NFRs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - run: flutter pub get
      - name: Reference environment
        run: |
          uname -a
          lscpu
          free -m
          flutter --version
      - name: Candidate vector preview materialization memory gates
        run: >-
          flutter test --concurrency=1
          qualification_test/p9_p913_performance_qualification_test.dart

  engineering-transactional:
    name: B-C Engineering + transactional qualification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - run: flutter pub get
      - name: Engineering-enabled / frozen proposal / provenance
        run: >-
          flutter test --concurrency=1
          test/p9_p96_apartment_wizard_engineering_pipeline_test.dart
          test/p9_p96_apartment_engineering_preview_panel_test.dart
          test/p9_p96_applied_engineering_persistence_test.dart
          test/p9_p96_production_persistence_owner_test.dart
          test/p9_generation_provenance_test.dart
      - name: GJ-01..04 Preview Diff Apply Undo Redo Save Reopen input continuity
        id: golden-journeys
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter test --concurrency=1 \
            qualification_test/p9_p913_golden_journey_test.dart \
            qualification_test/p9_p913_additional_journeys_test.dart \
            test/p9_apartment_p8_preview_diff_integration_test.dart \
            test/p9_apartment_wizard_ui_acceptance_test.dart \
            2>&1 | tee build/p9-final-acceptance/golden-journeys.log
      - name: Upload Golden Journey failure diagnostics
        if: failure() && steps.golden-journeys.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-golden-journey-failure-${{ github.sha }}
          path: build/p9-final-acceptance/golden-journeys.log
          if-no-files-found: error
          retention-days: 14
      - name: NG-01..10 negative journey regression set
        id: negative-journeys
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter test --concurrency=1 \
            qualification_test/p9_p913_negative_journeys_test.dart \
            test/p9_apartment_wizard_provider_test.dart \
            test/p9_apartment_topology_catalog_test.dart \
            test/p9_apartment_vector_renderer_test.dart \
            test/p9_apartment_p8_preview_diff_integration_test.dart \
            test/p9_apartment_wizard_ui_acceptance_test.dart \
            2>&1 | tee build/p9-final-acceptance/negative-journeys.log
      - name: Upload negative journey failure diagnostics
        if: failure() && steps.negative-journeys.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-negative-journey-failure-${{ github.sha }}
          path: build/p9-final-acceptance/negative-journeys.log
          if-no-files-found: error
          retention-days: 14

  responsive-qualification:
    name: D-F Responsive phone tablet desktop qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - run: flutter pub get
      - name: Viewport locale text-scale theme matrix and GJ-03
        id: responsive-matrix
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter test --concurrency=1 \
            qualification_test/p9_p913_responsive_matrix_test.dart \
            2>&1 | tee build/p9-final-acceptance/responsive-matrix.log
      - name: Upload responsive failure diagnostics
        if: failure() && steps.responsive-matrix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-responsive-failure-${{ github.sha }}
          path: build/p9-final-acceptance/responsive-matrix.log
          if-no-files-found: error
          retention-days: 14

  semantic-parity:
    name: G Semantic parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        shell: bash
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - run: flutter pub get
      - name: Emit semantic parity artifact
        run: dart run tool/p9_semantic_parity.dart build/p9-final-acceptance/p9-semantic-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: p9-semantic-parity-${{ runner.os }}
          path: build/p9-final-acceptance/p9-semantic-parity.json
          if-no-files-found: error
          retention-days: 30

  cross-platform-semantic-equality:
    name: G Cross-platform semantic equality
    needs: semantic-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: p9-semantic-parity-*
          path: parity
      - name: Compare Linux macOS Windows byte semantics
        run: |
          set -euo pipefail
          find parity -name p9-semantic-parity.json -print -exec sha256sum {} \;
          linux="parity/p9-semantic-parity-Linux/p9-semantic-parity.json"
          macos="parity/p9-semantic-parity-macOS/p9-semantic-parity.json"
          windows="parity/p9-semantic-parity-Windows/p9-semantic-parity.json"
          test -f "$linux"
          test -f "$macos"
          test -f "$windows"
          cmp --silent "$linux" "$macos"
          cmp --silent "$linux" "$windows"

  desktop-native:
    name: D Desktop native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: Linux
            platform: linux
          - os: windows-latest
            target: Windows
            platform: windows
          - os: macos-latest
            target: macOS
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        shell: bash
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Scaffold missing native shell for acceptance only
        run: flutter create --platforms=${{ matrix.platform }} --project-name elecx .
      - run: flutter pub get
      - name: Build Linux debug
        if: runner.os == 'Linux'
        run: flutter build linux --debug
      - name: Build Windows debug
        if: runner.os == 'Windows'
        run: flutter build windows --debug
      - name: Build macOS debug
        if: runner.os == 'macOS'
        run: flutter build macos --debug

  android-native:
    name: E-F Android phone + tablet native build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - name: Scaffold Android shell for acceptance only
        run: flutter create --platforms=android --project-name elecx .
      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: P9 compact/tablet semantic UI contract
        id: android-responsive
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter test --concurrency=1 \
            qualification_test/p9_p913_responsive_matrix_test.dart \
            2>&1 | tee build/p9-final-acceptance/android-responsive.log
      - name: Upload Android responsive failure diagnostics
        if: failure() && steps.android-responsive.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-android-responsive-failure-${{ github.sha }}
          path: build/p9-final-acceptance/android-responsive.log
          if-no-files-found: error
          retention-days: 14

  apple-mobile-native:
    name: E-F iOS + iPadOS native build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        shell: bash
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"frameworkVersion\"])')" = "3.47.7"
      - name: Scaffold iOS/iPadOS shell for acceptance only
        run: flutter create --platforms=ios --project-name elecx .
      - run: flutter pub get
      - name: Build iOS/iPadOS debug without signing
        run: flutter build ios --debug --no-codesign
      - name: P9 compact/tablet semantic UI contract
        id: apple-responsive
        run: |
          set -o pipefail
          mkdir -p build/p9-final-acceptance
          flutter test --concurrency=1 \
            qualification_test/p9_p913_responsive_matrix_test.dart \
            2>&1 | tee build/p9-final-acceptance/apple-responsive.log
      - name: Upload Apple responsive failure diagnostics
        if: failure() && steps.apple-responsive.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p9.13-apple-responsive-failure-${{ github.sha }}
          path: build/p9-final-acceptance/apple-responsive.log
          if-no-files-found: error
          retention-days: 14

  exact-sha-final-audit:
    name: H exact-SHA final audit
    needs:
      - repository-quality
      - domain-qualification
      - performance-qualification
      - engineering-transactional
      - responsive-qualification
      - cross-platform-semantic-equality
      - desktop-native
      - android-native
      - apple-mobile-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert checkout is exact workflow SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Create exact-SHA audit evidence
        run: |
          mkdir -p build/p9-final-acceptance
          cat > build/p9-final-acceptance/p9.13-final-audit.md <<EOF
          # P9.13 exact-SHA final audit

          - repository: ${GITHUB_REPOSITORY}
          - branch/ref: ${GITHUB_REF}
          - exact commit SHA: ${GITHUB_SHA}
          - workflow run: ${GITHUB_RUN_ID}
          - repository format/analyze/full regression suite: PASS
          - P8 accessibility/i18n regression gate: PASS
          - domain qualification: PASS
          - P9.13 performance + memory gates: PASS
          - engineering + transactional qualification: PASS
          - GJ-01..04: PASS
          - NG-01..10 regression set: PASS
          - responsive phone/tablet/desktop qualification: PASS
          - Linux/macOS/Windows semantic parity: PASS
          - Linux/Windows/macOS native target compilation: PASS
          - Android phone/tablet native target compilation: PASS
          - iOS/iPadOS native target compilation: PASS
          - traceability/evidence structure: PRESENT
          - native shell note: missing repository shells are generated ephemerally by Flutter for this P9.13 compile gate; permanent production shells remain PRE-P10 D001 scope
          - disposition: P9.13 automated acceptance gates PASS for this exact SHA
          EOF
          cat build/p9-final-acceptance/p9.13-final-audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: p9.13-exact-sha-final-audit-${{ github.sha }}
          path: build/p9-final-acceptance/p9.13-final-audit.md
          if-no-files-found: error
          retention-days: 90
