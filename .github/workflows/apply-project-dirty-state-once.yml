name: Apply project dirty state once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: python3 tool/apply_project_dirty_state_once.py
      - run: python3 tool/fix_project_dirty_lifecycle_once.py
      - run: dart format lib test
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Remove one-shot helpers
        if: success()
        run: rm -f tool/apply_project_dirty_state_once.py tool/fix_project_dirty_lifecycle_once.py .github/workflows/apply-project-dirty-state-once.yml
      - name: Commit verified dirty lifecycle
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(projects): add dirty state and close guard"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
