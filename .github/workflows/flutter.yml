name: Flutter

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Check Dart formatting
        id: format
        continue-on-error: true
        run: |
          set +e
          dart format --output=none --set-exit-if-changed lib test
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            dart format lib test
            git diff -- lib test > dart-format.diff
          fi
          exit "$status"
      - name: Upload formatter diff
        if: steps.format.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dart-format-diff
          path: dart-format.diff
          if-no-files-found: error
      - name: Enforce Dart formatting
        if: steps.format.outcome == 'failure'
        run: exit 1
      - run: flutter analyze
      - name: P8 NFR reference environment
        run: |
          uname -a
          lscpu
          free -m
          flutter --version
      - name: P8 NFR accessibility and i18n acceptance
        run: flutter test --concurrency=1 test/p8_wizard_nfr_a11y_i18n_qualification_test.dart
      - run: flutter test

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
