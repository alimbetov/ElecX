name: Flutter

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test
            git diff -- lib test
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
