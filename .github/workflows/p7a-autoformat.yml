name: P7A One-shot Formatter

on:
  push:
    branches:
      - feat/project-structure-authoring

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/project-structure-authoring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Apply Dart formatter
        run: dart format lib test
      - name: Commit formatting only
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style(p7a): apply Dart formatting"
          git push origin HEAD:feat/project-structure-authoring
