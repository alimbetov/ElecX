name: Format P1 lifecycle acceptance once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - .github/workflows/format-p1-lifecycle-acceptance-once.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Format acceptance test
        run: dart format test/p1_lifecycle_acceptance_test.dart
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Full tests
        run: flutter test
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/format-p1-lifecycle-acceptance-once.yml
      - name: Commit verified acceptance tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(editor): verify P1 lifecycle acceptance"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
