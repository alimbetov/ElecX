name: Apply P1 integrity hardening once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - .github/workflows/apply-p1-integrity-hardening-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply P1 integrity hardening
        run: python3 tool/apply_p1_integrity_hardening_once.py

      - name: Format
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        shell: bash
        run: flutter analyze 2>&1 | tee analyze.log

      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-analyzer-diagnostics
          path: analyze.log
          if-no-files-found: ignore

      - name: Test
        run: flutter test

      - name: Remove one-shot helpers
        run: |
          rm -f tool/apply_p1_integrity_hardening_once.py
          rm -f .github/workflows/apply-p1-integrity-hardening-once.yml

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(editor): close P1 document integrity gaps"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
