name: Apply cable canvas UI once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply deterministic patch
        run: python3 tool/apply_cable_canvas_ui.py
      - name: Format
        run: dart format lib test
      - name: Verify analysis
        run: flutter analyze
      - name: Verify tests
        run: flutter test
      - name: Remove one-shot helper
        run: |
          rm -f tool/apply_cable_canvas_ui.py
          rm -f .github/workflows/apply-cable-canvas-ui-once.yml
      - name: Commit UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(editor): integrate cable manipulation into surface canvas"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
