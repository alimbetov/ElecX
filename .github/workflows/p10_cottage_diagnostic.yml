name: P10 Cottage Diagnostic

on:
  push:
    branches: ["feat/p10-building-residential-composition"]

jobs:
  p107:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter pub get
      - name: P10.7 targeted qualification
        run: >-
          flutter test --concurrency=1 --reporter expanded
          test/p107_cottage_composition_test.dart
          test/p107_cottage_boundary_test.dart
