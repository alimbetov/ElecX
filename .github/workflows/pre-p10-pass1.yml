name: PRE-P10 PASS-1 Discovery

on:
  push:
    branches:
      - feat/pre-p10-cross-platform-hardening
      - feat/pre-p10-defect-remediation
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'qualification_test/**'
      - 'integration_test/**'
      - '.github/workflows/pre-p10-pass1.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

concurrency:
  group: pre-p10-pass1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-discovery:
    name: PASS1-Q01-Q03 startup discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter pub get
      - name: Reference environment
        run: flutter --version
      - name: Execute startup responsive keyboard locale probes
        id: startup-probes
        run: |
          set -o pipefail
          mkdir -p build/pre-p10-pass1
          flutter test --concurrency=1 \
            qualification_test/pre_p10_startup_qualification_test.dart \
            2>&1 | tee build/pre-p10-pass1/startup-probes.log
      - name: Upload startup discovery diagnostics
        if: failure() && steps.startup-probes.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pre-p10-pass1-startup-${{ github.sha }}
          path: build/pre-p10-pass1/startup-probes.log
          if-no-files-found: error
          retention-days: 30

  persistence-recovery-discovery:
    name: PASS1-Q04-Q05 persistence recovery discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter pub get
      - name: Execute Hub retry, canonical backup, and D020 replay recovery probes
        id: recovery-probes
        run: |
          set -o pipefail
          mkdir -p build/pre-p10-pass1
          flutter test --concurrency=1 \
            qualification_test/pre_p10_recovery_qualification_test.dart \
            qualification_test/pre_p10_cq14_d020_qualification_test.dart \
            2>&1 | tee build/pre-p10-pass1/recovery-probes.log
      - name: Upload recovery discovery diagnostics
        if: failure() && steps.recovery-probes.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pre-p10-pass1-recovery-${{ github.sha }}
          path: build/pre-p10-pass1/recovery-probes.log
          if-no-files-found: error
          retention-days: 30

  platform-store-init-discovery:
    name: PASS1-Q06 platform storage initialization recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter pub get
      - name: Execute same-session storage retry probe
        id: storage-init-probe
        run: |
          set -o pipefail
          mkdir -p build/pre-p10-pass1
          flutter test --concurrency=1 \
            qualification_test/pre_p10_platform_store_init_qualification_test.dart \
            2>&1 | tee build/pre-p10-pass1/storage-init-probe.log
      - name: Upload storage-init diagnostics
        if: failure() && steps.storage-init-probe.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pre-p10-pass1-storage-init-${{ github.sha }}
          path: build/pre-p10-pass1/storage-init-probe.log
          if-no-files-found: error
          retention-days: 30

  destructive-lifecycle-qualification:
    name: PRE10-CQ31 destructive full lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter pub get
      - name: Execute CQ31 destructive lifecycle qualification
        id: cq31
        run: |
          set -o pipefail
          mkdir -p build/pre-p10-pass1
          flutter test --concurrency=1 \
            qualification_test/pre_p10_cq31_destructive_lifecycle_qualification_test.dart \
            2>&1 | tee build/pre-p10-pass1/cq31-destructive-lifecycle.log
      - name: Upload CQ31 diagnostics
        if: failure() && steps.cq31.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pre-p10-cq31-${{ github.sha }}
          path: build/pre-p10-pass1/cq31-destructive-lifecycle.log
          if-no-files-found: error
          retention-days: 30
