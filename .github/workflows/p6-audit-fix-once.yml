name: P6 Audit Fix Once

on:
  push:
    branches: [feat/project-structure-authoring]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/project-structure-authoring
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply P6 audit hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/src/application/project/project_structure_authoring.dart')
          text = path.read_text()
          old = "import 'project_space_commands.dart';\n"
          new = old + "import 'project_space_semantics_editing.dart';\n"
          assert old in text and "project_space_semantics_editing.dart" not in text
          text = text.replace(old, new, 1)

          old = "  })  : _mutations = mutations,\n        _projectNorthEditing = ProjectNorthEditingSession(mutations),\n        _idFactory = idFactory,\n"
          new = "  })  : _mutations = mutations,\n        _projectNorthEditing = ProjectNorthEditingSession(mutations),\n        _spaceSemanticsEditing = ProjectSpaceSemanticsEditingSession(mutations),\n        _idFactory = idFactory,\n"
          if old not in text:
              old = "  }) : _mutations = mutations,\n       _projectNorthEditing = ProjectNorthEditingSession(mutations),\n       _idFactory = idFactory,\n"
              new = "  }) : _mutations = mutations,\n       _projectNorthEditing = ProjectNorthEditingSession(mutations),\n       _spaceSemanticsEditing = ProjectSpaceSemanticsEditingSession(mutations),\n       _idFactory = idFactory,\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  final ProjectNorthEditingPort _projectNorthEditing;\n  final EntityIdFactory _idFactory;\n"
          new = "  final ProjectNorthEditingPort _projectNorthEditing;\n  final ProjectSpaceSemanticsEditingPort _spaceSemanticsEditing;\n  final EntityIdFactory _idFactory;\n"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  ProjectNorthEditingPort get projectNorthEditing => _projectNorthEditing;\n"
          new = old + "\n  /// P6 semantic editing capability backed by the same P3 timeline as\n  /// structural authoring and Project North. Production presentation must not\n  /// construct a second ProjectMutationSession for selected-space semantics.\n  ProjectSpaceSemanticsEditingPort get spaceSemanticsEditing =>\n      _spaceSemanticsEditing;\n"
          assert old in text and "get spaceSemanticsEditing" not in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('lib/src/features/editor/space_semantics_inspector.dart')
          text = path.read_text()
          assert '      value: usage,\n' in text
          text = text.replace('      value: usage,\n', '      initialValue: usage,\n', 1)
          path.write_text(text)
          PY
      - name: Canonical format only audited files
        run: |
          dart format \
            lib/src/application/project/project_destructive_commands.dart \
            lib/src/application/project/project_mutation.dart \
            lib/src/application/project/project_space_commands.dart \
            lib/src/application/project/project_space_semantics_commands.dart \
            lib/src/application/project/project_structure_authoring.dart \
            lib/src/domain/project_aggregate.dart \
            lib/src/domain/project_identity.dart \
            lib/src/features/editor/canonical_space_semantics_adapter.dart \
            lib/src/features/editor/space_semantics_inspector.dart \
            lib/src/features/editor/space_semantics_inspector_editing.dart \
            lib/src/serialization/project/canonical_project_document_codec.dart \
            test/canonical_project_document_codec_test.dart \
            test/p5d_g_closure_test.dart \
            test/p6_semantic_mutation_test.dart \
            test/p6ab_domain_hardening_test.dart \
            test/p6f_space_semantics_editing_test.dart \
            test/p6_shared_mutation_timeline_test.dart
      - name: Remove one-shot workflow
        run: rm .github/workflows/p6-audit-fix-once.yml
      - name: Commit audit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(p6): harden shared mutation ownership and gates'
          git push origin HEAD:feat/project-structure-authoring
