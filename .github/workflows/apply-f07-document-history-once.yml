name: Apply F07 unified document history once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - '.github/workflows/apply-f07-document-history-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply F07 document history
        run: python3 tool/apply_f07_document_history_once.py
      - name: Fix F07 analyzer hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/features/editor/editor_document_history.dart')
          text = p.read_text()
          text = text.replace(
              "import '../../domain/project_model.dart';\n",
              "import '../../domain/project_model.dart';\nimport '../../domain/surfaces.dart';\n",
              1,
          )
          text = text.replace(
              '  late EditorP2Session _p2;',
              '  final EditorP2Session _p2;',
              1,
          )
          p.write_text(text)
          PY
      - name: Format
        run: dart format lib test
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Focused F07 tests
        run: flutter test test/f07_document_history_test.dart
      - name: Full test suite
        run: flutter test
      - name: Remove one-shot staging
        run: |
          git rm .github/workflows/apply-f07-document-history-once.yml
          git rm tool/apply_f07_document_history_once.py
      - name: Commit verified F07
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'fix(editor): unify document undo redo chronology'
          git push origin HEAD:feat/spatial-editor-interaction-hardening
