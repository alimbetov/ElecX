name: Apply F19 engineering contrast once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - '.github/workflows/apply-f19-contrast-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply F19 contrast patch
        run: python3 tool/apply_f19_contrast_once.py
      - name: Harden EngineeringColors lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/src/app/engineering_colors.dart')
          text = p.read_text()
          anchor = "  final Color onStatus;\n\n  @override\n"
          replacement = """  final Color onStatus;\n\n  static EngineeringColors of(BuildContext context) {\n    final theme = Theme.of(context);\n    return theme.extension<EngineeringColors>() ??\n        (theme.brightness == Brightness.dark\n            ? EngineeringColors.dark()\n            : EngineeringColors.light());\n  }\n\n  @override\n"""
          if anchor not in text:
              raise SystemExit('EngineeringColors insertion anchor not found')
          p.write_text(text.replace(anchor, replacement, 1))

          for file_name in [
              'lib/src/features/editor/engineering_selection_inspector.dart',
              'lib/src/features/editor/device_catalog_panel.dart',
          ]:
              path = Path(file_name)
              source = path.read_text()
              source = source.replace(
                  'Theme.of(context).extension<EngineeringColors>()!',
                  'EngineeringColors.of(context)',
              )
              path.write_text(source)
          PY
      - name: Format
        run: dart format lib test
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Full tests with diagnostic capture
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > f19_failure.log 2>&1
          code=$?
          cat f19_failure.log
          if [ "$code" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add f19_failure.log
            git commit -m 'chore(ci): capture F19 failing test output'
            git push origin HEAD:feat/spatial-editor-interaction-hardening
            exit "$code"
          fi
      - name: Remove one-shot staging
        run: |
          git rm .github/workflows/apply-f19-contrast-once.yml
          git rm tool/apply_f19_contrast_once.py
          git rm -f f19_failure.log || true
      - name: Commit verified contrast patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'fix(editor): make engineering status colors theme-aware'
          git push origin HEAD:feat/spatial-editor-interaction-hardening
