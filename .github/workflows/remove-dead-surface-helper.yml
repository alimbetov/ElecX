name: Remove Dead Surface Helper

on:
  push:
    branches: [feat/spatial-editor-foundation]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Remove unused helper and use hosted route medium
        shell: bash
        run: |
          sed -i '/^  RouteMediumProfile _mediumForRoute/,/^  }$/d' lib/src/features/editor/surface_canvas.dart
          sed -i 's/final medium = _mediumForRoute(route.routeId);/final medium = route.medium;/' lib/src/features/editor/surface_canvas.dart
      - name: Normalize pending hardening files
        run: dart format lib/src/features/editor/surface_canvas.dart lib/src/domain/circuit_cable_registry.dart test/circuit_cable_registry_conflict_test.dart test/catalog_component_identity_test.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/editor/surface_canvas.dart lib/src/domain/circuit_cable_registry.dart test/circuit_cable_registry_conflict_test.dart test/catalog_component_identity_test.dart
          if git diff --cached --quiet; then
            echo "No verified cleanup changes required."
            exit 0
          fi
          git commit -m "fix: verify route painter and registry hardening"
          git push origin HEAD:feat/spatial-editor-foundation
