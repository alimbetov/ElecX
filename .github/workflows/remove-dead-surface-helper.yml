name: Remove Dead Surface Helper

on:
  push:
    branches: [feat/spatial-editor-foundation]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-foundation
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Remove unused helper
        run: sed -i '/^  RouteMediumProfile _mediumForRoute/,/^  }$/d' lib/src/features/editor/surface_canvas.dart
      - run: dart format lib/src/features/editor/surface_canvas.dart
      - run: flutter analyze
      - run: flutter test
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/editor/surface_canvas.dart
          git commit -m "fix: remove dead surface route helper"
          git push origin HEAD:feat/spatial-editor-foundation
