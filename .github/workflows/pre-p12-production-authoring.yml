name: PRE-P12 Production Authoring

on:
  push:
    branches: [main, "feat/pre-p12-production-authoring-closure"]
  pull_request:
  workflow_dispatch:

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Verify pinned Flutter toolchain
        run: |
          flutter --version
          test "$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.47.7"
      - run: flutter pub get
      - name: Analyze PRE-P12 production authoring surface
        run: flutter analyze
      - name: PRE-P12 focused production acceptance
        run: >-
          flutter test --concurrency=1 --reporter=expanded
          test/project_space_boundary_commands_test.dart
          test/project_room_rectangle_authoring_test.dart
          test/canonical_editor_production_materializer_test.dart
          test/canonical_editor_screen_cutover_binding_test.dart
          test/pre_p12_room_persistence_qualification_test.dart
          test/pre_p12_production_reachability_qualification_test.dart
