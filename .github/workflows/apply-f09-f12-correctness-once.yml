name: Apply F09 F12 correctness once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - .github/workflows/apply-f09-f12-correctness-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Apply F09 F12 correctness patch
        run: python3 tool/apply_f09_f12_correctness_once.py
      - name: Format
        run: dart format lib test
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        shell: bash
        run: flutter analyze 2>&1 | tee analyze.log
      - name: Full tests
        shell: bash
        run: flutter test 2>&1 | tee test.log
      - name: Remove one-shot staging
        run: |
          rm -f tool/apply_f09_f12_correctness_once.py
          rm -f .github/workflows/apply-f09-f12-correctness-once.yml
      - name: Commit verified correctness patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(editor): align route focus and wheel zoom policy"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
