name: Apply F08 atomic group transform once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - '.github/workflows/apply-f08-group-transform-once.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply F08 group transform
        run: python3 tool/apply_f08_group_transform_once.py
      - name: Format
        run: dart format lib test
      - name: Verify format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Focused F08 tests
        run: flutter test test/f08_group_transform_test.dart test/component_transform_session_test.dart
      - name: Full test suite
        run: flutter test
      - name: Remove one-shot staging
        run: |
          git rm .github/workflows/apply-f08-group-transform-once.yml
          git rm tool/apply_f08_group_transform_once.py
      - name: Commit verified F08
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'fix(editor): make group component transforms atomic'
          git push origin HEAD:feat/spatial-editor-interaction-hardening
