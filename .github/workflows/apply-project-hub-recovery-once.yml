name: Apply project hub recovery once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening
    paths:
      - .github/workflows/apply-project-hub-recovery-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply project hub recovery patch
        run: python3 tool/apply_project_hub_recovery_once.py

      - name: Format
        run: dart format lib test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Remove one-shot helpers
        run: |
          rm -f tool/apply_project_hub_recovery_once.py
          rm -f .github/workflows/apply-project-hub-recovery-once.yml

      - name: Commit verified production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(projects): expose crash recovery in project hub"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
