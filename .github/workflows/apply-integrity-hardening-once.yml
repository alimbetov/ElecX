name: Apply integrity hardening once

on:
  push:
    branches:
      - feat/spatial-editor-interaction-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/spatial-editor-interaction-hardening
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: python3 tool/apply_integrity_hardening_once.py
      - run: dart format lib test
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Remove one-shot helpers
        run: |
          rm tool/apply_integrity_hardening_once.py
          rm .github/workflows/apply-integrity-hardening-once.yml
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editor): enforce model integrity invariants"
          git push origin HEAD:feat/spatial-editor-interaction-hardening
