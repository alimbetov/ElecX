name: P6 Targeted Format

on:
  push:
    branches:
      - feat/project-structure-authoring

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format P6 files only
        run: |
          dart format \
            lib/src/application/project/project_mutation.dart \
            lib/src/domain/project_aggregate.dart \
            lib/src/domain/project_space_semantics.dart \
            lib/src/serialization/project/canonical_project_document_codec.dart \
            test/canonical_project_document_codec_test.dart \
            test/p6_semantic_mutation_test.dart \
            test/p6_semantic_persistence_test.dart
      - name: Commit targeted formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/application/project/project_mutation.dart \
            lib/src/domain/project_aggregate.dart \
            lib/src/domain/project_space_semantics.dart \
            lib/src/serialization/project/canonical_project_document_codec.dart \
            test/canonical_project_document_codec_test.dart \
            test/p6_semantic_mutation_test.dart \
            test/p6_semantic_persistence_test.dart
          git commit -m "style(p6): apply targeted dart format"
          git push origin "HEAD:${GITHUB_REF_NAME}"
